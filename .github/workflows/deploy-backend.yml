name: Deploy backend to Fly

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          FLY_REGION: ${{ secrets.FLY_REGION }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          if [ -z "$FLY_API_TOKEN" ]; then echo 'FLY_API_TOKEN is required'; exit 1; fi
          fly auth token "$FLY_API_TOKEN"
          fly volumes create ${FLY_APP_NAME}-data --size 1 --region ${FLY_REGION:-iad} || true
          fly deploy --remote-only -a "$FLY_APP_NAME"
