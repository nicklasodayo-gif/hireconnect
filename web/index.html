<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HireConnect — Connect Talent With Opportunity</title>
<meta name="description" content="HireConnect: a modern recruitment platform connecting Kenyan job seekers, employers and recruiters." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<!--
  This frontend intentionally ships with zero build step: React, ReactDOM
  and Babel Standalone are loaded from a CDN and JSX is transpiled in the
  browser. That's a deliberate trade-off for THIS environment (no npm
  registry access to run a Vite/webpack build), not a recommendation for
  production traffic — see docs/ARCHITECTURE.md "Frontend build" for how to
  migrate this to a proper Vite + TypeScript build with zero behavior
  changes (the components are already written as plain functions with no
  build-only syntax beyond JSX).
-->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react" src="config.js"></script>
<script type="text/babel" data-presets="react" src="api.js"></script>
<script type="text/babel" data-presets="react" src="components.js"></script>
<script type="text/babel" data-presets="react" src="pages-public.js"></script>
<script type="text/babel" data-presets="react" src="pages-candidate.js"></script>
<script type="text/babel" data-presets="react" src="pages-employer.js"></script>
<script type="text/babel" data-presets="react" src="pages-admin.js"></script>
<script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
